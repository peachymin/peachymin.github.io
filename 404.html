(function(){var p=location.pathname.replace(/\/+$/,'').split('/').pop();

<style>
:root{--bg:#fffdee;--ink:#1d1a14;--mute:#5b564a;--red:#eb3e3a;--blue:#2f3da8;--pix:'Pixelify Sans',monospace;--sans:'Sora',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100svh;display:flex;flex-direction:column}
.top{display:flex;justify-content:flex-end;padding:16px}
.pills{display:flex;gap:8px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px 56px;text-align:center}
.box{position:relative;display:inline-flex;align-items:center;gap:.1em;margin:0;padding:.14em .26em;font:700 clamp(84px,18vw,148px)/1 var(--pix);outline:2px solid var(--red);color:var(--red)}
.box i{position:absolute;width:11px;height:11px;background:var(--bg);border:2px solid var(--red);transform:translate(-50%,-50%)}
.box i:nth-of-type(1){left:0;top:0}.box i:nth-of-type(2){left:100%;top:0}.box i:nth-of-type(3){left:0;top:100%}.box i:nth-of-type(4){left:100%;top:100%}
.cat{display:block;height:.66em;width:auto;aspect-ratio:1;color:var(--ink);overflow:hidden}
.cat .sock{fill:var(--bg)}
.cat .pup{fill:var(--ink)}
.msg{font-size:17px;line-height:1.5;margin:26px 0 0;max-width:34ch}

var HEART="<svg viewBox='0 0 7 6' width='%d' height='%d' shape-rendering='crispEdges' aria-hidden='true'><g fill='#eb3e3a'><rect x='1' y='0' width='2' height='1'/><rect x='4' y='0' width='2' height='1'/><rect x='0' y='1' width='7' height='2'/><rect x='1' y='3' width='5' height='1'/><rect x='2' y='4' width='3' height='1'/><rect x='3' y='5' width='1' height='1'/></g><rect x='1' y='1' width='1' height='1' fill='#ffb3a8'/></svg>";
var catbtn=document.getElementById('catbtn'),reduceM=matchMedia('(prefers-reduced-motion:reduce)').matches,lastPt={x:innerWidth/2,y:innerHeight/2};
addEventListener('pointermove',function(e){lastPt={x:e.clientX,y:e.clientY}});
function hearts(){
  var r=cat.getBoundingClientRect(),n=7;
  for(var i=0;i<n;i++){(function(i){
    setTimeout(function(){
      var h=document.createElement('div'),sz=[16,20,24,28][Math.floor(Math.random()*4)];
      h.className='heart';h.innerHTML=HEART.replace(/%d/g,sz);
      h.style.setProperty('--x',(r.left+r.width*(.25+Math.random()*.55))+'px');
      h.style.setProperty('--y',(r.top+r.height*.2)+'px');
      h.style.setProperty('--dx',(Math.random()*70-35)+'px');
      h.style.setProperty('--rise',(70+Math.random()*60)+'px');
      document.body.appendChild(h);setTimeout(function(){h.remove()},1600);
    },reduceM?0:i*110);
  })(i)}
}
function feed(from){
  var r=cat.getBoundingClientRect(),tx=r.left+r.width*.55,ty=r.top+r.height*.4;
  function done(){catbtn.classList.remove('hop');void catbtn.offsetWidth;catbtn.classList.add('hop');hearts()}
  if(reduceM){done();return}
  var f=document.createElement('div');f.className='flyfish';f.innerHTML=FISH;
  f.style.transform='translate('+from.x+'px,'+from.y+'px)';document.body.appendChild(f);
  requestAnimationFrame(function(){requestAnimationFrame(function(){f.style.transform='translate('+(tx-20)+'px,'+(ty-18)+'px) scale(.5)';f.style.opacity='.2'})});
  setTimeout(function(){f.remove();done()},400);
}
catbtn.addEventListener('click',function(e){
  var kb=e.detail===0;
  feed(kb?{x:catbtn.getBoundingClientRect().left+20,y:catbtn.getBoundingClientRect().top-30}:{x:e.clientX,y:e.clientY});
});
var go=document.getElementById('go');

look(innerWidth/2,innerHeight);
})();
